# Builds every driver in builds.json from Mesa's source and publishes them as a release, with drivers.json listing them.
name: Build drivers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [builds.json]

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.read.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "builds=$(jq -c . builds.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.list.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build bison flex glslang-tools patchelf zip pkg-config
          pip install --break-system-packages -q 'meson>=1.5' mako pyyaml packaging
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $(basename "$ANDROID_NDK_LATEST_HOME")"
      - name: Build ${{ matrix.build.name }}
        run: scripts/build.sh "${{ matrix.build.id }}" "${{ matrix.build.name }}" "${{ matrix.build.ref }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.id }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="drivers-$(date -u +%Y-%m-%d)-r${{ github.run_number }}"
          python3 scripts/catalog.py out "https://github.com/${{ github.repository }}/releases/download/$tag"
          {
            echo "Mesa's Turnip Vulkan driver for Adreno GPUs, built unmodified from Mesa's source by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            jq -r '.drivers[] | "- **\(.name)**: Mesa \(.mesaVersion), [\(.commit[:12])](https://gitlab.freedesktop.org/mesa/mesa/-/commit/\(.commit)), SHA-256 `\(.sha256)`"' out/drivers.json
          } > notes.md
          gh release create "$tag" out/*.zip out/drivers.json --title "$tag" --notes-file notes.md --latest
